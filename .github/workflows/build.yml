name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Jumper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jumper-android
          path: Jumper.apk
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Jumper.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EXE
        working-directory: pc
        run: |
          python -m pip install --upgrade "pyinstaller>=6.10"
          python -m PyInstaller --onefile --clean --noconfirm --name Jumper jumper.py
          copy dist\Jumper.exe ..\Jumper.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Jumper-windows
          path: Jumper.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Jumper.exe
